<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vigil Adversarial Lab — Navigation Race & Stale Isolation</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; color: #1e293b; }
    .card { border: 1px solid #e2e8f0; border-radius: 12px; padding: 1.5rem; background: #fff; margin-bottom: 1rem; }
    .btn { background: #0284c7; color: #fff; border: none; padding: 10px 20px; border-radius: 6px; font-weight: 600; cursor: pointer; margin-right: 0.5rem; }
    .console { background: #0f172a; color: #38bdf8; font-family: monospace; font-size: 0.85rem; padding: 1rem; border-radius: 8px; height: 160px; overflow-y: auto; }
  </style>
</head>
<body>
  <h1>Vigil Adversarial Lab: Navigation Race Simulation</h1>
  <p>Simulates rapid page transitions where in-flight observations from a previous page (Page A) arrive asynchronously after a new page (Page B) has already loaded.</p>

  <div class="card">
    <div id="pageState" style="font-weight: 700; margin-bottom: 1rem;">Active Navigation: None</div>
    <button class="btn" id="btnPageA">1. Load Page A (Catalog)</button>
    <button class="btn" id="btnPageB">2. Rapid Navigate to Page B (Cart)</button>
    <button class="btn" id="btnDelayedA" style="background: #dc2626;">3. Inject Delayed Page A Event</button>
  </div>

  <div class="console" id="logConsole">Console ready. Click steps 1 -> 2 -> 3.</div>

  <script>
    const logEl = document.getElementById('logConsole');
    const stateEl = document.getElementById('pageState');
    let currentNav = null;

    function log(msg) {
      logEl.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg + '\n' + logEl.textContent;
    }

    document.getElementById('btnPageA').addEventListener('click', () => {
      currentNav = 'nav-page-A';
      stateEl.textContent = 'Active Navigation: Page A (nav-page-A)';
      log('Page A loaded. Emitted observation with navigationId: nav-page-A');
    });

    document.getElementById('btnPageB').addEventListener('click', () => {
      currentNav = 'nav-page-B';
      stateEl.textContent = 'Active Navigation: Page B (nav-page-B)';
      log('User rapidly navigated to Page B. Active navigation is now nav-page-B');
    });

    document.getElementById('btnDelayedA').addEventListener('click', () => {
      log('Simulating delayed in-flight message arriving with navigationId: nav-page-A...');
      if (currentNav === 'nav-page-B') {
        log('Vigil navigationState detected mismatch! Message dropped: stale_navigation.');
        log('Integrity preserved: Page B evidence DAG remains 100% clean.');
      } else {
        log('Warning: Navigate to Page B first to test race condition.');
      }
    });
  </script>
</body>
</html>
